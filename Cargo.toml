[package]
name = "kokoro-tts"
description = "用于Rust的轻量级AI离线语音合成器（Kokoro TTS），可轻松交叉编译到移动端"
version = "0.3.3"
edition = "2024"
keywords = ["TTS", "Offline", "Lite", "AI", "Synthesizer"]
license = "Apache-2.0"
repository = "https://github.com/mzdk100/kokoro.git"
readme = "README.md"

[features]
use-cmudict = ["cmudict-fast"]

[dependencies]
bincode = "2.0.1"
chinese-number = { version = "0.8.2", default-features = false, features = [
    "number-to-chinese",
    "chinese-to-number",
] }
cmudict-fast = { version = "0.8.0", optional = true }
futures = "0.3.34"
jieba-rs = "0.10.3"
log = "0.4.34"
ndarray = "0.17.2"
ort = { git = "https://github.com/pykeio/ort", branch = "main", features = ["cuda"] }
pin-project = "1.1.13"
pinyin = "0.11.0"
rand = "0.10.2"
# rand = { git = "https://github.com/rust-random/rand", branch = "master" }
regex = "1.13.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "fs",
    "rt-multi-thread",
    "time",
    "sync",
] }

[dev-dependencies]
anyhow = "1.0.104"
tokio = {version = "1.53.1",features = ["macros"]}
voxudio = { version = "0.7.4",features = ["device"] }

[build-dependencies]
cc = "1.4.4"
