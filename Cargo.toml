[package]
name = "kokoro-tts"
description = "用于Rust的轻量级AI离线语音合成器（Kokoro TTS），可轻松交叉编译到移动端"
version = "0.3.3"
edition = "2024"
keywords = ["TTS", "Offline", "Lite", "AI", "Synthesizer"]
license = "Apache-2.0"
repository = "https://github.com/mzdk100/kokoro.git"
readme = "README.md"

[features]
use-cmudict = ["cmudict-fast"]

[dependencies]
bincode = "2.0.1"
chinese-number = { version = "0.8.2", default-features = false, features = [
    "number-to-chinese",
    "chinese-to-number",
] }
cmudict-fast = { version = "0.8.0", optional = true }
futures = "0.3.34"
jieba-rs = "0.11.0"
log = "0.4.35"
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.15", features = ["cuda"] }
pin-project = "1.1.13"
pinyin = "0.11.0"
regex = "1.13.2"
tokio = { version = "1.54.1", features = [
    "fs",
    "rt-multi-thread",
    "time",
    "sync",
] }

[dev-dependencies]
anyhow = "1.0.104"
tokio = {version = "1.54.1",features = ["macros"]}
voxudio = { version = "0.8.0",features = ["device"] }

[build-dependencies]
cc = "1.11.2"
